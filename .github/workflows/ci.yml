# CI — Bible Step 1 DoD ("CI builds image, generates SBOM, trivy scan passes").
#
# Gate order follows Step 16's pipeline: lint -> tests -> security scans -> build. The later gates
# named there (eval gate at Step 8, adversarial gate at Step 9) attach to this file as separate jobs
# when those steps land; the point of standing this up now is that they have somewhere to attach.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run -- CI minutes on a superseded commit are
# spent proving something nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a full commit SHA, with the release it came from in the comment. A tag is
# a name the action's owner (or whoever steals their token) can move; a SHA cannot be moved. Not
# hypothetical: on 2026-03-19 attackers force-pushed 76 of aquasecurity/trivy-action's 77 tags to a
# credential stealer, and every workflow pinned by tag ran it (GHSA-69fq-xp46-6x23). Same reasoning
# as the Dockerfile's base-image digest. Refresh deliberately: resolve the new release's SHA and
# commit it, so an action upgrade is a reviewed diff rather than a silent event.

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # --frozen: install exactly what uv.lock says and fail if it disagrees with pyproject.toml.
      # Without it CI can silently resolve a different dependency set than any developer has, so a
      # green build proves nothing about what actually ships.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check app/ tests/

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/

      - name: Mypy
        run: uv run mypy app/

      # The coverage floor lives in pyproject.toml ([tool.coverage] fail_under), so it is enforced
      # identically here and on a developer machine -- one number, one place.
      - name: Pytest
        run: uv run pytest

  image:
    name: build · SBOM · vulnerability scan
    runs-on: ubuntu-latest
    needs: quality        # do not spend a build on code that fails lint or tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t production-agentic-ai:${{ github.sha }} .

      # An SBOM is the inventory that makes "are we affected by this new CVE?" a lookup instead of an
      # investigation. Retained as an artifact so the question can be asked about a *past* build too.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: production-agentic-ai:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json

      # ignore-unfixed: fail only on vulnerabilities that have a patch available. An unfixed CVE in
      # the base image is real but not actionable in this pipeline, and a gate that cannot be made
      # green teaches people to bypass it -- which costs more than the finding it reports.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (immutable release, post-incident)
        with:
          image-ref: production-agentic-ai:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
