# ==========================
# Layer 0/1 — local production topology (dev stack): api + Postgres. Observability joins at Step 7.
# Cloud-required pieces (stress-test VM, image registry) go to Azure, not here.
# Bring up:  docker compose up --build
# ==========================
services:
  api:
    build: .
    env_file:
      - .env.development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # pgvector, not plain postgres:16-alpine, and swapped now while the volume is still empty.
    # Two reasons: Step 5's long-term memory needs the vector extension anyway, and the alpine
    # image is musl-based while this one is Debian/glibc -- same PG major, but the two sort strings
    # differently, so text indexes built under one and read under the other can silently miss rows
    # on an index scan until a REINDEX. Free today, an afternoon once there is data.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prometheus + Grafana return with Step 7 (observability), together with the /metrics endpoint
  # they scrape and a prometheus.yml to mount. Until then they had nothing to collect, and with
  # ./prometheus holding only a .gitkeep the bind mount hid the image's default config, so
  # Prometheus crash-looped under restart: unless-stopped. Removed rather than left broken.

volumes:
  pgdata:
